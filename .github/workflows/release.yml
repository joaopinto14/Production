name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (for example v2.0.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate, publish and create GitHub Release
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Resolve stable release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: ${tag}" >&2
            echo "Expected format: vX.Y.Z" >&2
            exit 1
          fi

          version="${tag#v}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag matches VERSION
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          file_version="$(tr -d '[:space:]' < VERSION)"

          if [[ "${file_version}" != "${RELEASE_VERSION}" ]]; then
            echo "Release tag/version mismatch." >&2
            echo "Tag version: ${RELEASE_VERSION}" >&2
            echo "VERSION file: ${file_version}" >&2
            exit 1
          fi

      - name: Resolve release revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run stable release validation
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./tests/test-release.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: joaopinto14
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture images and stable aliases
        id: publish
        env:
          IMAGE_NAME: joaopinto14/production
          VERSION: ${{ steps.release.outputs.version }}
          VCS_REF: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          policy="$(git tag --list | python3 scripts/release-policy.py "${VERSION}")"
          echo "${policy}" >> "${GITHUB_OUTPUT}"
          export PUBLISH_ALIASES="$(printf '%s\n' "${policy}" | sed -n 's/^publish_aliases=//p')"
          docker buildx bake release --push --metadata-file release-metadata.json

      - name: Compare published packages with the previous stable release
        env:
          PREVIOUS_VERSION: ${{ steps.publish.outputs.previous_version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_VERSION}" ]]; then
            echo "No previous stable version found; cannot produce a verified package comparison." >&2
            exit 1
          fi
          python3 scripts/package-report.py \
            --previous-version "${PREVIOUS_VERSION}" \
            --version "${RELEASE_VERSION}" \
            --metadata release-metadata.json \
            --output release-packages
          cp RELEASE.md release-notes.md
          printf '\n\n' >> release-notes.md
          cat release-packages.md >> release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; updating package evidence."
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" release-packages.json release-packages.md --clobber --repo "${GITHUB_REPOSITORY}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Production ${RELEASE_VERSION}" \
            --notes-file release-notes.md
          gh release upload "${RELEASE_TAG}" release-packages.json release-packages.md --repo "${GITHUB_REPOSITORY}"
