name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (vX.Y.Z)
        required: true
        type: string
      repair_notes:
        description: Repair notes only; never build or promote images
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  request:
    name: Request or recover release after main CI
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Request publication using the immutable release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/release-automation.py prepare --revision "${REVISION}" --output "${GITHUB_OUTPUT}"

  resolve:
    name: Verify tag matches VERSION
    needs: request
    if: >-
      ${{ !cancelled() && !failure() &&
          (github.event_name != 'workflow_run' ||
           (needs.request.result == 'success' && needs.request.outputs.tag != '')) }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      previous_version: ${{ steps.source.outputs.previous_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve reviewed release source
        id: source
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REQUEST_TAG: ${{ needs.request.outputs.tag }}
          REPAIR_NOTES: ${{ inputs.repair_notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${REQUEST_TAG:-${GITHUB_REF_NAME}}}"
          [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git checkout --detach "refs/tags/${tag}"
          git merge-base --is-ancestor HEAD origin/main
          version="${tag#v}"
          test "$(cat VERSION)" = "${version}"
          revision="$(git rev-parse HEAD)"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "revision=${revision}"
            if [[ "${REPAIR_NOTES}" != true ]]; then
              python3 release-tools/scripts/release-automation.py previous --version "${version}"
            fi
          } >> "${GITHUB_OUTPUT}"

  candidates:
    name: Build staging artifacts once
    needs: resolve
    if: ${{ !inputs.repair_notes }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: joaopinto14
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout reviewed release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Create or resume staging candidates
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: python3 release-tools/scripts/release-candidates.py --version "${VERSION}" --revision "${REVISION}"
      - name: Verify registry platforms, identity, SBOM and provenance
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          python3 release-tools/scripts/verify-release.py --version "${VERSION}" --revision "${REVISION}" \
            --metadata release-metadata.json --output release-artifacts.json
      - name: Preserve immutable candidate metadata
        if: ${{ !cancelled() && (hashFiles('release-metadata.json') != '' || hashFiles('release-artifacts.json') != '') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidates
          path: |
            release-metadata.json
            release-artifacts.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  validate:
    name: Validate exact artifacts (${{ matrix.arch }})
    needs: [resolve, candidates]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: production-candidate
      VERSION: ${{ needs.resolve.outputs.version }}
      REVISION: ${{ needs.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidates
      - name: Pull, inventory and scan the exact registry digests
        run: |
          python3 scripts/check-candidates.py --platform linux/${{ matrix.arch }} \
            --metadata release-metadata.json --revision "${REVISION}"
      - name: Run regression tests and real applications without rebuilding
        run: |
          python3 scripts/validate-candidate.py --platform linux/${{ matrix.arch }} \
            --revision "${REVISION}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: release-evidence-${{ matrix.arch }}
          path: candidate-reports/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  package-report:
    name: Prepare package comparison before promotion
    needs: [resolve, candidates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed release note tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidates
      - env:
          PREVIOUS_VERSION: ${{ needs.resolve.outputs.previous_version }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          test -n "${PREVIOUS_VERSION}"
          python3 scripts/package-report.py --previous-version "${PREVIOUS_VERSION}" \
            --version "${VERSION}" --metadata release-metadata.json --output release-packages
          python3 release-tools/scripts/release-notes.py --repository "${GITHUB_REPOSITORY}" \
            --previous-version "${PREVIOUS_VERSION}" --version "${VERSION}" \
            --revision "${REVISION}" --output release-changes
          cp RELEASE.md release-notes.md
          {
            printf '\n\n'
            cat release-changes.md
            printf '\n\n'
            cat release-packages.md
          } >> release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-report
          path: |
            release-packages.*
            release-changes.*
            release-notes.md
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  publish:
    name: Sign and promote validated digests
    needs: [resolve, candidates, validate, package-report]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      REVISION: ${{ needs.resolve.outputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-report
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-amd64
          path: release-evidence/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-arm64
          path: release-evidence/arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: joaopinto14
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Checkout reviewed release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Verify complete evidence and version-tag conflicts before signing
        run: |
          python3 release-tools/scripts/verify-release.py --version "${VERSION}" --revision "${REVISION}" \
            --metadata release-metadata.json --output release-artifacts.json
          python3 release-tools/scripts/promote-release.py --version "${VERSION}" --revision "${REVISION}" \
            --metadata release-metadata.json --evidence release-evidence --aliases false --check-only
      - name: Sign and verify each tested index
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          python3 -c 'import json; print("\n".join(sorted({"joaopinto14/production@"+x["containerimage.digest"] for x in json.load(open("release-metadata.json")).values()})))' > release-digests.txt
          while IFS= read -r reference; do
            cosign sign --yes "${reference}"
            python3 release-tools/scripts/verify-signature.py --identity "${COSIGN_IDENTITY}" \
              --issuer https://token.actions.githubusercontent.com "${reference}"
          done < release-digests.txt
      - name: Save draft release and evidence before changing public tags
        run: |
          set -euo pipefail
          tar -czf release-evidence.tar.gz release-evidence
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --draft --title "Production ${VERSION}" --notes-file release-notes.md
          fi
          gh release upload "${RELEASE_TAG}" release-metadata.json release-packages.json \
            release-packages.md release-changes.md release-changes.json release-evidence.tar.gz release-digests.txt release-artifacts.json \
            --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Promote the same signed and validated manifests
        run: |
          set -euo pipefail
          git fetch origin --tags
          policy="$(git tag --list | python3 scripts/release-policy.py "${VERSION}")"
          aliases="$(printf '%s\n' "${policy}" | sed -n 's/^publish_aliases=//p')"
          python3 release-tools/scripts/promote-release.py --version "${VERSION}" --revision "${REVISION}" \
            --metadata release-metadata.json --evidence release-evidence --aliases "${aliases}"
          verify_aliases=()
          if [[ "${aliases}" == true ]]; then verify_aliases+=(--aliases); fi
          python3 release-tools/scripts/verify-release.py --version "${VERSION}" --revision "${REVISION}" \
            --metadata release-metadata.json --verified-artifacts release-artifacts.json \
            --published "${verify_aliases[@]}"
          gh release upload "${RELEASE_TAG}" release-promotion.json release-verification.json \
            --clobber --repo "${GITHUB_REPOSITORY}"
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --notes-file release-notes.md
      - name: Preserve promotion journal even after a partial registry failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-promotion
          path: |
            release-promotion.json
            release-artifacts.json
            release-verification.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  repair-notes:
    name: Repair existing release notes without publishing images
    needs: resolve
    if: ${{ inputs.repair_notes }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" --pattern release-packages.md --repo "${GITHUB_REPOSITORY}"
          assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          if printf '%s\n' "${assets}" | grep -qx release-changes.md; then
            gh release download "${RELEASE_TAG}" --pattern release-changes.md --repo "${GITHUB_REPOSITORY}"
          fi
          cp RELEASE.md release-notes.md
          {
            printf '\n\n'
            if [ -f release-changes.md ]; then
              cat release-changes.md
              printf '\n\n'
            fi
            cat release-packages.md
          } >> release-notes.md
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md
