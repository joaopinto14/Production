name: Release

on:
  push:
    tags:
      - 'v2.0.0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish 2.0.0
    if: github.ref == 'refs/tags/v2.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run stable release validation
        run: ./tests/test-release.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: joaopinto14
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture images and stable aliases
        env:
          IMAGE_NAME: joaopinto14/production
          VERSION: 2.0.0
          VCS_REF: ${{ github.sha }}
        run: docker buildx bake release --push
