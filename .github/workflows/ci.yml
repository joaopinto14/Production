name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    name: Runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build fresh images with the tested revision
        id: build
        run: |
          VERSION="$(cat VERSION)" VCS_REF="$(git rev-parse HEAD)" docker buildx bake --pull --no-cache --load

      - name: Run intensive tests and real PHP/Laravel applications
        run: |
          python3 scripts/validate-candidate.py --platform linux/amd64 \
            --revision "$(git rev-parse HEAD)"

      - name: Inventory and scan tested images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/check-candidates.py --repository production --platform linux/amd64

      - name: Preserve scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-scan-evidence
          path: candidate-reports/
          if-no-files-found: warn
          retention-days: 30

  multiarch-build:
    name: Multi-architecture build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build amd64 and arm64 variants
        run: docker buildx bake multiarch
