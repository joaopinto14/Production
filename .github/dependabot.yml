version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    # A new Alpine branch requires a package/support-matrix review first.
    ignore:
      - dependency-name: alpine
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
