worker_processes 1;
pid /run/production/nginx/nginx.pid;
pcre_jit on;

error_log /dev/stderr warn;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    charset utf-8;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /run/production/nginx/client_body;
    proxy_temp_path /run/production/nginx/proxy;
    fastcgi_temp_path /run/production/nginx/fastcgi;
    uwsgi_temp_path /run/production/nginx/uwsgi;
    scgi_temp_path /run/production/nginx/scgi;

    gzip on;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    log_format main escape=json
        '{'
        '"time_local":"$time_local",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"remote_addr":"$remote_addr"'
        '}';

    access_log /dev/stdout main;

    include /run/production/nginx/http.d/*.conf;
}
